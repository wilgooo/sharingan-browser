name: Sharingan Android - free runner experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = attempt APK; gn-only = stop after gn gen --check; preflight = measure reclaimed disk only'
        type: choice
        options: [build, gn-only, preflight]
        default: build
      jobs:
        description: 'Compile workers (fewer workers use less RAM)'
        type: choice
        options: ['2', '3', '4', '1']
        default: '2'

permissions:
  contents: read

concurrency:
  group: sharingan-free-${{ github.ref }}
  cancel-in-progress: false

# A full compile exceeds one six-hour job. Each stage resumes the previous
# stage's saved ninja output; a stage only follows one that ran out of time,
# never one whose compile failed.
jobs:
  stage-1:
    if: ${{ github.event.repository.private == false }}
    uses: ./.github/workflows/android-stage.yml
    with: {mode: '${{ inputs.mode }}', jobs: '${{ inputs.jobs }}', stage: 1, stages: 3}

  stage-2:
    needs: stage-1
    if: ${{ needs.stage-1.outputs.resume == 'true' }}
    uses: ./.github/workflows/android-stage.yml
    with: {mode: '${{ inputs.mode }}', jobs: '${{ inputs.jobs }}', stage: 2, stages: 3}

  stage-3:
    needs: stage-2
    if: ${{ needs.stage-2.outputs.resume == 'true' }}
    uses: ./.github/workflows/android-stage.yml
    with: {mode: '${{ inputs.mode }}', jobs: '${{ inputs.jobs }}', stage: 3, stages: 3}
